name: 提交并开 PR（门禁内移 · 自动合并）
description: >
  将工作区变更提交到固定 CI 分支，开/复用 PR，门禁通过后立即合并入 base。
  对齐 jp-life-work 模式：bot（GITHUB_TOKEN）创建的 PR 其 pull_request 工作流
  不会正常触发（需人工批准），故门禁由调用工作流在提交前执行，分支保护不再
  要求必需状态检查；本动作只负责「建 PR → 立即合并」，实现零审批、零 review、零 PAT。
inputs:
  branch:
    description: CI 分支名（固定，便于复用同一 PR）
    required: true
  title:
    description: PR 标题
    required: true
  body:
    description: PR 正文
    required: false
    default: ""
  commit-message:
    description: 提交信息
    required: true
  add-paths:
    description: 提交路径（默认 -A 全部）
    required: false
    default: "-A"
  base:
    description: 目标分支
    required: false
    default: "main"
  merge:
    description: 门禁通过后是否立即合并（默认 true；失败记录类提交设 false）
    required: false
    default: "true"
  token:
    description: 开 PR 令牌（留空回退 GITHUB_TOKEN；如设 PAT / GitHub App 令牌则 PR 作者变更）
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: 配置 git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: 提交前工作区清理（缓存/临时/构建产物）
      shell: bash
      run: |
        PY="$(command -v python3 || command -v python)"
        "$PY" engine/tools/workspace_cleanup.py

    - name: 切到 CI 分支并提交
      id: commit
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        ADD_PATHS: ${{ inputs.add-paths }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        set +e
        git checkout -B "$BRANCH"
        if [ "$ADD_PATHS" = "-A" ] || [ "$ADD_PATHS" = "." ]; then
          git add -A
        else
          # shellcheck disable=SC2086
          git add -- $ADD_PATHS
        fi
        if git diff --cached --quiet; then
          echo "NO_CHANGES=true" >> "$GITHUB_OUTPUT"
          echo "无变更，跳过提交"
          exit 0
        fi
        git commit -m "$COMMIT_MESSAGE"
        echo "NO_CHANGES=false" >> "$GITHUB_OUTPUT"

    - name: 变基到最新 main 并推送分支
      if: steps.commit.outputs.NO_CHANGES != 'true'
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
      run: |
        set +e
        git fetch origin main
        if ! git rebase origin/main; then
          git rebase --abort
          echo "::error::rebase 到 origin/main 冲突，无法提交 PR；将在下次运行时重试"
          exit 1
        fi
        for i in 1 2 3; do
          # 先刷新 CI 分支的远端跟踪引用，否则并发 / 前序运行后 --force-with-lease 会因
          # 本地引用过期被拒（stale info）。远端尚无该分支时回退普通 force。
          git fetch --force origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null || true
          if git push --force-with-lease -u origin "$BRANCH"; then exit 0; fi
          if git push --force -u origin "$BRANCH"; then exit 0; fi
          sleep 5
        done
        echo "::error::CI 分支推送失败"
        exit 1

    - name: 开/复用 PR 并合并
      if: steps.commit.outputs.NO_CHANGES != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        BRANCH: ${{ inputs.branch }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        BASE: ${{ inputs.base }}
        MERGE: ${{ inputs.merge }}
      run: |
        set +e
        number=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' 2>/dev/null)
        if [ -z "$number" ]; then
          gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body "$BODY" \
            || { echo "::error::创建 PR 失败"; exit 1; }
          number=$(gh pr view "$BRANCH" --json number -q .number)
          echo "已创建 PR #$number"
        else
          echo "复用已有 PR #$number"
        fi
        if [ "$MERGE" != "true" ]; then
          echo "merge=false（失败记录类提交），仅开 PR 不合并"
          exit 0
        fi
        # 门禁已由调用工作流在提交前执行（失败即中止本 job）；此处门禁通过即立即合并，
        # 不依赖 pull_request 工作流（bot 创建的 PR 不触发，且分支保护不再要求必需检查）。
        for i in 1 2 3; do
          if gh pr merge "$number" --merge; then
            echo "PR #$number 门禁通过，已合并入 $BASE"
            exit 0
          fi
          sleep 5
        done
        echo "::error::合并 PR #$number 失败"
        exit 1
