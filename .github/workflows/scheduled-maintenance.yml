name: 定时维护

# 周期性结构维护 + 质量巡检 + 可追溯索引刷新。
#
# 触发（public 仓库 Actions 免费，恢复自动触发）：
#   - schedule：每周一 02:30 UTC（北京 10:30），错峰避开整点
#   - workflow_dispatch：手动补跑
#
# 轻量任务（Python 脚本），单次约 1–3 分钟；每周自动提交「心跳」，规避 60 天不活动禁用定时任务。
# 活跃度检查：距上次 commit >45 天创建预警 Issue。

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "跳过单元测试（应急）"
        type: boolean
        default: false

# 与 html-sync / content-update 共用同一并发组：
# 三者都会向 main 提交并推送，串行执行可避免 push 被远端拒绝，
# 也避免并发写 INDEX.md（其「最近生成」时间戳会让 rebase 冲突）。
#
# 平台行为注意：同一并发组只保留一个「排队中」的运行，新运行进入时
# 会取消旧的排队运行。因此请勿在数秒内连续手动触发多个自动提交工作流；
# 若某次运行被 cancel，重新触发即可。
concurrency:
  group: auto-commit-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  statuses: write
  pull-requests: write

jobs:
  maintenance:
    name: 结构维护与质量巡检
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0

      - name: 工作区预清理（缓存/临时/构建产物）
        uses: ./.github/actions/workspace-cleanup

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: 安装依赖（重试）
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4  # v2
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: pip install -r requirements.txt

      - name: 结构补全（幂等）
        run: python engine/tools/ensure_region_topics.py

      - name: 报告自动归位
        run: |
          set +e
          python engine/tools/classify_reports.py --apply --unknown-warn
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "::error::报告归位失败（移动失败或存在可自动归位的错位）"
            exit 1
          elif [ "$code" -eq 2 ]; then
            echo "::warning::存在需人工确认的报告归属（不阻断提交）"
          fi
          exit 0

      - name: 维护流水线（HTML / 归档 / 索引 / 汇总页 / 发布日历 / 发布指纹）
        run: |
          python engine/tools/md2html.py
          python engine/tools/archive_reports.py
          # 审计文档轮转（《方案》Phase 3.2）：engine/report-audits 根只保留最近 12 个月，
          # 更早的移入 archives/；复用 archive_reports.py，不另写轮转。
          python engine/tools/archive_reports.py --audit-docs
          python engine/tools/build_index.py
          python engine/tools/build_hub.py
          python engine/tools/release_calendar.py --emit engine/report-audits/release-calendar.json
          python engine/tools/publish_fingerprint.py --emit

      # 审计流水轮转：append-only 的 pipeline_runs.jsonl 超量时归档，避免无限增长。
      - name: 审计流水轮转（超量归档）
        run: python engine/tools/pipeline_audit.py --rotate

      # 审计登记册 stale 检测与清理（《方案》Phase 2.3）：复用 audit_tool，不另写检测。
      # prune 移除登记路径不存在的失效条目；status 输出 stale 计数（应为 0）。
      - name: 审计登记册 stale 检测与清理
        run: |
          set +e
          python engine/audit/scripts/audit_tool.py prune
          python engine/audit/scripts/audit_tool.py status
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::审计登记册曾存在失效条目（prune 已清理，见上方输出）"
          elif [ "$code" -ne 0 ]; then
            echo "::error::审计登记册状态检查失败（退出码 $code）"
            exit 1
          fi
          exit 0

      # L3 SLA 超期检测（R3 / L3 SLA）：语义终审每两周覆盖全部有效正式报告；
      # 复用 audit_tool l3-status（纯读、幂等），超期只告警不阻断提交。
      - name: L3 SLA 超期检测
        run: |
          set +e
          python engine/audit/scripts/audit_tool.py l3-status
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::L3 语义终审存在超期报告（见上方 [OVERDUE] 输出，不阻断提交）"
          elif [ "$code" -ne 0 ]; then
            echo "::error::L3 SLA 超期检测执行失败（退出码 $code）"
            exit 1
          fi
          exit 0

      # 核验台账回填（INFORMATION-VERIFICATION-SPEC v1.0）：首次从现有 source_registry
      # 生成 append-only 核验事件；台账已非空时幂等跳过（不重复回填）。
      - name: 核验台账回填（幂等）
        run: |
          set +e
          python engine/tools/verification_ledger.py backfill --actor ci-backfill
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::核验台账回填失败（退出码 $code）"
            exit 1
          fi
          exit 0

      # 核验台账哈希链校验：seq 连续 / prev_hash 链接 / hash 重算；
      # 链断裂 = 核验留痕被篡改，阻断提交。
      - name: 核验台账哈希链校验
        run: |
          set +e
          python engine/tools/verification_ledger.py verify
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::核验台账链校验失败（退出码 $code：链断裂 / 篡改）"
            exit 1
          fi
          exit 0

      # 来源定期复核（INFORMATION-VERIFICATION-SPEC v1.0）：按机构 tier 重核周期扫描
      # 全部登记，到期 / 临期只告警不阻断；结果落盘 pending_verification.json。
      - name: 来源定期复核（到期 / 临期告警）
        run: |
          set +e
          python engine/audit/scripts/audit_tool.py verify-review --period auto \
            --emit engine/audit/records/pending_verification.json
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::来源定期复核存在到期 / 临期来源（见上方输出，不阻断提交）"
          elif [ "$code" -ne 0 ]; then
            echo "::error::来源定期复核执行失败（退出码 $code）"
            exit 1
          fi
          exit 0

      # A-05 链接可达率探测（11-19 方案 P1-5 C 轨道）：定期 --probe 并落审计记录，
      # 供 A-05 指标与 E 类死链台账对账；结果不计入门禁阻断（网络不可达仅告警）。
      - name: A-05 链接可达率探测（定期落盘）
        run: |
          set +e
          python engine/tools/source_check.py --probe --probe-lenient --gate-period auto \
            --emit engine/audit/records/link-probe.json
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "::error::链接探测执行失败（退出码 1）"
            exit 1
          fi
          echo "链接探测完成（退出码 $code：0 无错误 / 2 仅告警，均不阻断）"
          exit 0

      # IGI 趋势快照（11-19 方案 C 轨道）：按 gate-period 落盘 igi_history.json，
      # 供 audit_tool status 输出八度趋势表（上一「审计登记册 stale 检测」步骤）。
      # 同周期重跑为覆盖，幂等；period 取滚动 gate-period（当前自然月）。
      - name: IGI 趋势快照（按 gate-period 落盘）
        run: python engine/audit/scripts/audit_tool.py igi-snapshot

      # 全链路唯一门禁入口（P1-2 去重）：与 ci.yml 同口径（含 probe）。
      - name: 优化流程一致性门禁（统一入口 · 含 probe）
        run: |
          set +e
          python engine/tools/optimization_gate.py --gate-period auto --source-gate-period auto --probe
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "::error::统一门禁失败：存在错误项（见上方输出）"
            exit 1
          elif [ "$code" -eq 2 ]; then
            echo "::warning::统一门禁存在警告项（不阻断提交）"
          fi
          exit 0

      # 报告合规性审计：定期校验历史产出报告与对应类型模板规则的匹配度，
      # 写入 engine/report-audits/compliance-audit.md（随维护提交留痕）；发现不符合项不阻断，转预警 Issue。
      - name: 报告合规性审计（历史报告 × 模板匹配度）
        id: audit
        run: |
          set +e
          python engine/tools/compliance_check.py --audit
          code=$?
          violated=false
          if [ "$code" -eq 1 ]; then
            echo "::error::合规审计执行失败（规则文件缺失或非法）"
            exit 1
          elif [ "$code" -eq 2 ]; then
            violated=true
            echo "::warning::合规审计发现历史报告与模板不匹配项（不阻断，已写入审计报告）"
          fi
          echo "violated=$violated" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 合规审计预警（存在不匹配项）
        if: steps.audit.outputs.violated == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[report-compliance] 历史报告合规审计发现不匹配项 @ ${context.runId}`,
              labels: ['report-compliance'],
              body: [
                '本轮合规审计发现历史报告与对应类型模板规则存在不匹配项，明细见仓库 `engine/report-audits/compliance-audit.md`。',
                '',
                '处理方式：',
                '1. 打开审计报告，按 `[E]` / `[W]` 明细逐项定位报告；',
                '2. 属结构缺失 / 必填字段缺失的（`[E]`），按对应类型模板补齐后提交；',
                '3. 属业务固化锚超额节的（`[W]`），人工确认后在 compliance-rules.json 或模板侧留痕。',
                '',
                `审计运行：${context.payload.repository.html_url}/actions/runs/${context.runId}`
              ].join('\n')
            });

      - name: 单元测试
        if: ${{ !inputs.skip_tests }}
        run: python -m unittest discover -s engine/tests -v

      # 效率保障（P1-4 / T6）：压测并落盘 perf-status.json。
      # 阈值校验由统一门禁（optimization_gate 的 perf_monitor 项）承载，此处不重复调用
      # perf_monitor.py check（P1-2 去重：门禁只走统一入口，不得分项重复扫描）。
      - name: 性能压测采集（阈值校验由统一门禁承载）
        run: |
          set +e
          python engine/tools/perf_bench.py --samples 2 --skip-parallel
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::性能压测执行失败（perf_bench 退出码 $code）"
            exit 1
          fi
          echo "perf-status.json 已更新；阈值校验见上方统一门禁 perf_monitor 项"
          exit 0

      # 闭环修正工单：统一承接「门禁 [E]」与「活跃度超阈值」两类异常，
      # 生成含失败明细 / 责任归属周期 / 可执行复跑命令的标准化工单（幂等）。
      # 替代原有的「活跃度检查 + 活跃度预警」通知模式，升级为可落地执行的工单流程。
      - name: 闭环修正工单（门禁 [E] / 活跃度超阈值）
        if: always()
        uses: ./.github/actions/remediation-ticket

      - name: 记录维护状态
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then result="success"; else result="failure"; fi
          python engine/tools/automation_status.py record \
            --phase maintenance \
            --result "$result" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: 提交并开 PR（自动合并）
        if: success()
        uses: ./.github/actions/submit-pr
        with:
          branch: ci/scheduled-maintenance
          title: "chore: 定时维护（结构/校验/归档/索引/性能，由 CI 生成）"
          body: |
            由定时维护工作流自动生成（结构补全 / 归档 / 索引 / 汇总页 / 发布日历 / 发布指纹 / 性能基线）。
            合并方式：必需检查通过后自动合并（合并队列）。
          commit-message: "chore: 定时维护（结构/校验/归档/索引/性能）"
          # content/：维护流水线的 md2html.py 会再生成 reports/*.html，
          # 必须纳入提交范围，否则残留未暂存改动会让 submit-pr 变基失败。
          add-paths: "automation-status.json index.html reader.html INDEX.md content perf-status.json engine/report-audits engine/audit/records/publish_fingerprints.json engine/audit/records/audit_registry.json engine/audit/records/igi_history.json engine/audit/records/link-probe.json engine/audit/records/verification_ledger.jsonl engine/audit/records/pending_verification.json"
          token: ${{ secrets.CI_PR_TOKEN }}

      - name: 提交失败状态（仅失败时，开 PR 记录，不自动合并）
        if: failure()
        uses: ./.github/actions/submit-pr
        with:
          branch: ci/maintenance-status
          title: "chore: 记录维护失败状态 @ ${{ github.run_id }}"
          body: |
            定时维护失败时记录 automation-status.json，供人工排查。
            不自动合并，需人工确认。
          commit-message: "chore: 记录维护失败状态"
          add-paths: "automation-status.json"
          enable-auto-merge: "false"
          token: ${{ secrets.CI_PR_TOKEN }}

      - name: 上报 commit status
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              context: 'scheduled-maintenance',
              description: state === 'success' ? '维护完成' : '维护失败',
              target_url: `${context.payload.repository.html_url}/actions/runs/${context.runId}`
            });

      - name: 失败告警
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[automation-failure] 定时维护失败 @ ${context.runId}`,
              labels: ['automation-failure'],
              body: [
                '定时维护流水线执行失败，请查看日志并手动补跑。',
                '',
                `- 运行链接：${runUrl}`,
                `- 触发提交：${context.sha}`,
                `- 触发方式：${context.eventName}`,
                '',
                '补跑方式：Actions → 定时维护 → Run workflow。'
              ].join('\n')
            });

      - name: 工作区收尾清理（始终执行）
        if: always()
        uses: ./.github/actions/workspace-cleanup

  # 可复用工作流只能写在「作业」层级（jobs.<id>.uses），不能作为步骤的 uses，
  # 否则整个工作流文件校验失败（运行 0 秒、无作业产生）。
  webhook-alert:
    name: Webhook 告警
    needs: maintenance
    if: failure()
    uses: ./.github/workflows/webhook-alert.yml
    with:
      title: "[automation-failure] 定时维护失败 @ ${{ github.run_id }}"
      message: |
        定时维护流水线执行失败，请查看日志并手动补跑。
        运行链接：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      level: error
      run_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    secrets:
      AUTOMATION_WEBHOOK_URL: ${{ secrets.AUTOMATION_WEBHOOK_URL }}
