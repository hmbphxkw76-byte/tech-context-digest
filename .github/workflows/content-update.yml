name: 内容更新编排

# 周期性内容更新「任务清单 + 触发」编排。
#
# 说明：GitHub Actions 无法直接运行 AI Agent，因此本工作流负责
#   「到点提醒 + 准备素材 + 事后校验」，把「判断与写作」留给 AI Agent：
#   - 生成任务清单（项目·周期·提示词·登记载体·上期报告 + 发布日历摘要）
#   - 创建 content-update Issue，供本地妙手自动化 / 手动执行
#   - 执行维护流水线，保证索引与归档同步
#
# 触发（public 仓库 Actions 免费，恢复自动触发）：
#   - schedule：每月 1 日 03:17 UTC（季度首月 1 / 4 / 7 / 10 月已包含在内）
#   - workflow_dispatch：手动（可指定 project / period）
#   - repository_dispatch：外部 / Agent 触发（client_payload: project / period）
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      project:
        description: "项目路径（可选，如 content/economy/dubai/apartment）"
        required: false
        default: ""
      period:
        description: "周期（可选，如 2026-11 / 2026-Q1 / 2026）"
        required: false
        default: ""
  repository_dispatch:
    types: [content-update-requested]

# 与 html-sync / scheduled-maintenance 共用同一并发组：
# 三者都会向 main 提交并推送，串行执行可避免 push 被远端拒绝，
# 也避免并发写 INDEX.md（其「最近生成」时间戳会让 rebase 冲突）。
#
# 平台行为注意：同一并发组只保留一个「排队中」的运行，新运行进入时
# 会取消旧的排队运行。因此请勿在数秒内连续手动触发多个自动提交工作流；
# 若某次运行被 cancel，重新触发即可。
concurrency:
  group: auto-commit-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  statuses: write
  pull-requests: write

jobs:
  prepare:
    name: 生成更新任务清单
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: 工作区预清理（缓存/临时/构建产物）
        uses: ./.github/actions/workspace-cleanup

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: 安装依赖（重试）
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4  # v2
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: pip install -r requirements.txt

      - name: 报告自动归位
        run: |
          set +e
          python engine/tools/classify_reports.py --apply --unknown-warn
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "::error::报告归位失败（移动失败或存在可自动归位的错位）"
            exit 1
          elif [ "$code" -eq 2 ]; then
            echo "::warning::存在需人工确认的报告归属（不阻断）"
          fi
          exit 0

      - name: 维护流水线（结构 / HTML / 归档 / 索引 / 汇总页 / 发布日历采集）
        run: |
          python engine/tools/ensure_region_topics.py
          python engine/tools/md2html.py
          python engine/tools/archive_reports.py
          python engine/tools/build_index.py
          python engine/tools/build_hub.py
          python engine/tools/release_calendar.py --emit engine/report-audits/release-calendar.json

      # 生成前置核验：全链路唯一门禁入口（P1-2 去重），与 ci.yml 同口径（含 probe）。
      # 在创建本期生成任务 Issue 之前执行——信息核验未过时，不派发生成任务，
      # 使「报告中不呈现未核验信息」（report_verification）在生成前即被拦截。
      - name: 生成前置核验：优化流程一致性门禁（统一入口 · 含 probe）
        run: |
          set +e
          python engine/tools/optimization_gate.py --gate-period auto --source-gate-period auto --probe
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "::error::统一门禁失败：存在错误项（见上方输出）"
            exit 1
          elif [ "$code" -eq 2 ]; then
            echo "::warning::统一门禁存在警告项（不阻断）"
          fi
          exit 0

      - name: 计算周期标识
        id: period
        run: |
          month=$(date -u +%m)
          year=$(date -u +%Y)
          case "$month" in
            01|04|07|10) period="$year-Q$(( (10#$month - 1) / 3 + 1 ))" ;;
            *) period="$year-$month" ;;
          esac
          echo "value=$period" >> "$GITHUB_OUTPUT"
          echo "本期周期：$period"

      - name: 生成任务清单
        env:
          PLANNER_PROJECT: ${{ inputs.project || github.event.client_payload.project || '' }}
          PLANNER_PERIOD: ${{ inputs.period || github.event.client_payload.period || '' }}
        run: |
          mkdir -p .automation-tmp
          args=()
          [ -n "$PLANNER_PROJECT" ] && args+=(--project "$PLANNER_PROJECT")
          [ -n "$PLANNER_PERIOD" ] && args+=(--period "$PLANNER_PERIOD")
          python engine/tools/update_planner.py --porcelain --pending-only "${args[@]}" > .automation-tmp/tasks.json
          python engine/tools/update_planner.py --pending-only "${args[@]}" > .automation-tmp/tasks.md
          cat .automation-tmp/tasks.md

      - name: 创建任务 Issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const fs = require('fs');
            const tasks = JSON.parse(fs.readFileSync('.automation-tmp/tasks.json', 'utf8'));
            if (!tasks.length) {
              console.log('本期无待更新任务（均已产出或未到产出周期），跳过创建 Issue');
              return;
            }
            const body = fs.readFileSync('.automation-tmp/tasks.md', 'utf8');
            const period = '${{ steps.period.outputs.value }}';
            const title = `内容更新任务 · ${period}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'content-update'
            });
            if (issues.some(i => i.title === title)) {
              console.log(`已存在同周期任务 Issue（${title}），跳过创建`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['content-update'],
              body: [
                body,
                '',
                '---',
                `触发运行：${context.payload.repository.html_url}/actions/runs/${context.runId}`,
                '',
                '执行方式（三选一）：',
                '1. 本地妙手自动化：按任务清单执行提示词并提交；',
                '2. 手动：按任务清单逐项执行；',
                '3. 外部 AI 服务：通过 secrets 触发（需另行配置）。'
              ].join('\n')
            });

      - name: 记录内容更新状态
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then result="success"; else result="failure"; fi
          python engine/tools/automation_status.py record \
            --phase content-update \
            --result "$result" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: 提交并开 PR（自动合并）
        if: success()
        uses: ./.github/actions/submit-pr
        with:
          branch: ci/content-update
          title: "chore: 内容更新编排（索引刷新，由 CI 生成）"
          body: |
            由内容更新编排工作流自动生成（INDEX.md / automation-status.json / index.html / reader.html / release-calendar.json）。
            合并方式：必需检查通过后自动合并（合并队列）。
          commit-message: "chore: 内容更新编排（索引刷新）"
          # content/：维护流水线的 md2html.py 会再生成 reports/*.html，
          # 必须纳入提交范围，否则残留未暂存改动会让 submit-pr 变基失败。
          add-paths: "INDEX.md automation-status.json index.html reader.html content engine/report-audits/release-calendar.json"
          token: ${{ secrets.CI_PR_TOKEN }}

      - name: 上报 commit status
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              context: 'content-update',
              description: state === 'success' ? '任务清单已生成' : '编排失败',
              target_url: `${context.payload.repository.html_url}/actions/runs/${context.runId}`
            });

      - name: 失败告警
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[automation-failure] 内容更新编排失败 @ ${context.runId}`,
              labels: ['automation-failure'],
              body: [
                '内容更新编排执行失败，任务清单可能未生成，请手动补跑。',
                '',
                `- 运行链接：${runUrl}`,
                `- 触发方式：${context.eventName}`,
                '',
                '补跑方式：Actions → 内容更新编排 → Run workflow。'
              ].join('\n')
            });

      - name: 闭环修正工单（门禁 [E] / 活跃度超阈值）
        if: always()
        uses: ./.github/actions/remediation-ticket

      - name: 工作区收尾清理（始终执行）
        if: always()
        uses: ./.github/actions/workspace-cleanup

  # 可复用工作流只能写在「作业」层级（jobs.<id>.uses），不能作为步骤的 uses，
  # 否则整个工作流文件校验失败（运行 0 秒、无作业产生）。
  webhook-alert:
    name: Webhook 告警
    needs: prepare
    if: failure()
    uses: ./.github/workflows/webhook-alert.yml
    with:
      title: "[automation-failure] 内容更新编排失败 @ ${{ github.run_id }}"
      message: |
        内容更新编排执行失败，任务清单可能未生成，请手动补跑。
        运行链接：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      level: error
      run_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    secrets:
      AUTOMATION_WEBHOOK_URL: ${{ secrets.AUTOMATION_WEBHOOK_URL }}
